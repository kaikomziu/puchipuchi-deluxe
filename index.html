<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>プチプチDELUXE - 無限に潰せるバブルラップ</title>
<meta name="description" content="無限にプチプチを潰し続けられるバブルラップ緩衝材シミュレーター。押すたびに気持ちいい音が鳴り、潰した数はずっと記録される。">
<link rel="canonical" href="https://kaikomziu.github.io/puchipuchi-deluxe/">
<meta property="og:type" content="website">
<meta property="og:title" content="プチプチDELUXE - 無限に潰せるバブルラップ">
<meta property="og:description" content="無限にプチプチを潰し続けられるバブルラップ緩衝材シミュレーター。押すたびに気持ちいい音が鳴り、潰した数はずっと記録される。">
<meta property="og:url" content="https://kaikomziu.github.io/puchipuchi-deluxe/">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --bg1:#0f1226; --bg2:#1b2148; --ink:#eaf0ff; --sub:#9aa6d4;
    --accent:#5df2c4; --accent2:#ffd24d;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg1) 70%);
    color:var(--ink); overflow:hidden; touch-action:manipulation;
    display:flex; flex-direction:column; height:100dvh;
  }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 18px; flex:0 0 auto;
  }
  .title{display:flex; flex-direction:column; gap:2px;}
  .title h1{font-size:clamp(18px,4.5vw,26px); letter-spacing:.06em; line-height:1;
    text-shadow:0 0 18px rgba(93,242,196,.35);}
  .title .sub{font-size:10.5px; letter-spacing:.18em; color:var(--sub);}

  .stats{display:flex; align-items:center; gap:14px;}
  .count-box{text-align:right; line-height:1.2;}
  .count-box .num{font-size:clamp(18px,4vw,24px); font-weight:800; color:var(--accent2);
    text-shadow:0 0 14px rgba(255,210,77,.35); font-variant-numeric:tabular-nums;}
  .count-box .lbl{font-size:9.5px; letter-spacing:.14em; color:var(--sub);}

  .iconbtn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1.5px rgba(154,166,212,.3);
    color:var(--ink); font-size:17px; display:flex; align-items:center; justify-content:center;
    transition:transform .1s, background .15s;
  }
  .iconbtn:active{transform:scale(.9);}
  .iconbtn.off{color:var(--sub); opacity:.55;}

  .sound-wrap{position:relative;}
  .sound-panel{
    position:absolute; top:46px; right:0; z-index:10;
    display:flex; flex-direction:column; gap:5px;
    background:#171b3a; padding:8px; border-radius:14px; min-width:150px;
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(154,166,212,.18);
    opacity:0; transform:translateY(-6px) scale(.96); pointer-events:none;
    transition:opacity .15s, transform .15s;
  }
  .sound-panel.open{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .sound-opt{
    display:flex; align-items:center; gap:8px; text-align:left;
    border:none; cursor:pointer; padding:8px 10px; border-radius:9px;
    background:transparent; color:var(--sub); font-size:12.5px; letter-spacing:.03em;
    font-family:inherit;
  }
  .sound-opt .sw{width:18px; text-align:center;}
  .sound-opt.active{background:rgba(93,242,196,.14); color:var(--ink); font-weight:700;}
  .sound-opt:active{transform:scale(.97);}

  main{
    flex:1 1 auto; position:relative; overflow:hidden;
    margin:0 10px 10px; border-radius:20px;
    background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }

  #sheet{
    position:absolute; inset:0;
    overflow:auto;
    touch-action:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #sheet::-webkit-scrollbar{ display:none; }

  #canvas{
    position:relative;
  }

  .scroll-cue{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    font-size:11px; color:var(--sub); letter-spacing:.08em; text-align:center;
    pointer-events:none; transition:opacity .5s; opacity:.8; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .scroll-cue.hidden{opacity:0;}
  .scroll-cue .arrow{ animation:bob 1.4s ease-in-out infinite; font-size:14px; }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(5px); }
  }

  .bubble{
    position:absolute; border-radius:50%;
    transform:rotate(var(--tilt,0deg)) scale(1);
    transform-origin:50% 50%;
    background:
      radial-gradient(circle at var(--hx,32%) var(--hy,28%), rgba(255,255,255,.97), rgba(255,255,255,.2) 36%, rgba(140,180,255,.42) 66%, rgba(90,125,225,.3) 100%);
    box-shadow:
      inset -3px -3px 5px rgba(20,30,70,.35),
      inset 2px 2px 4px rgba(255,255,255,.55),
      0 2px 2px rgba(0,0,0,.18);
    transition:box-shadow .18s, background .18s;
    cursor:pointer;
    will-change:transform;
  }
  .bubble::after{
    content:""; position:absolute; inset:-30%; border-radius:50%;
    border:2px solid var(--accent); opacity:0; transform:scale(.5); pointer-events:none;
  }
  .bubble.pop-anim::after{ animation:ring .5s ease-out forwards; }
  @keyframes ring{
    0%{opacity:.75; transform:scale(.35);}
    100%{opacity:0; transform:scale(1.9);}
  }

  .bubble[data-popped="1"]{
    background:
      radial-gradient(circle at var(--hx,38%) var(--hy,34%), rgba(255,255,255,.14), rgba(90,110,165,.38) 50%, rgba(45,55,100,.55) 100%),
      linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,.12) 70%, rgba(255,255,255,.04) 100%);
    box-shadow:
      inset 3px 3px 6px rgba(0,0,0,.5),
      inset -1px -1px 3px rgba(255,255,255,.1),
      inset 0 0 10px rgba(0,0,0,.25);
  }

  .particle{
    position:absolute; top:0; left:0; border-radius:50%; pointer-events:none; z-index:6;
    background:radial-gradient(circle at 35% 30%, #fff, rgba(255,255,255,.5) 55%, rgba(150,190,255,.25) 100%);
  }
  .pop-flash{
    position:absolute; top:0; left:0; border-radius:50%; pointer-events:none; z-index:4;
    background:radial-gradient(circle, rgba(93,242,196,.5), rgba(93,242,196,.12) 45%, rgba(93,242,196,0) 72%);
  }

  .hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:13px; color:var(--sub); letter-spacing:.1em; text-align:center;
    pointer-events:none; transition:opacity .5s; line-height:1.9;
  }
  .hint.hidden{opacity:0;}

  footer{
    flex:0 0 auto; text-align:center; padding:6px 0 10px; font-size:10px;
    color:var(--sub); letter-spacing:.08em; opacity:.55;
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>プチプチ<span style="color:var(--accent)">DELUXE</span></h1>
    <div class="sub">無限バブルラップ</div>
  </div>
  <div class="stats">
    <div class="count-box">
      <div class="num" id="countNum">0</div>
      <div class="lbl">累計プチ数</div>
    </div>
    <div class="sound-wrap">
      <button class="iconbtn" id="voiceBtn" title="音色を選ぶ">🎵</button>
      <div class="sound-panel" id="soundPanel"></div>
    </div>
    <button class="iconbtn" id="soundBtn" title="音のON/OFF">🔊</button>
  </div>
</header>

<main>
  <div id="sheet"><div id="canvas"></div></div>
  <div class="hint" id="hint">なぞる・タップで<br>プチッと潰そう</div>
  <div class="scroll-cue" id="scrollCue"><span>スクロールでどこまでも広がる</span><span class="arrow">▼</span></div>
</main>

<footer>破れても大丈夫。時間が経つとまたプチプチできるようになるよ</footer>

<script>
(function(){
  "use strict";

  var sheet = document.getElementById('sheet');
  var canvas = document.getElementById('canvas');
  var mainEl = document.querySelector('main');
  var hint = document.getElementById('hint');
  var scrollCue = document.getElementById('scrollCue');
  var countNum = document.getElementById('countNum');
  var soundBtn = document.getElementById('soundBtn');
  var voiceBtn = document.getElementById('voiceBtn');
  var soundPanel = document.getElementById('soundPanel');

  var STORAGE_COUNT = 'puchipuchi_deluxe_total';
  var STORAGE_MUTE = 'puchipuchi_deluxe_muted';
  var STORAGE_SOUND = 'puchipuchi_deluxe_soundset';

  var total = 0;
  try { total = parseInt(localStorage.getItem(STORAGE_COUNT), 10) || 0; } catch(e){}
  var muted = false;
  try { muted = localStorage.getItem(STORAGE_MUTE) === '1'; } catch(e){}

  function renderCount(){ countNum.textContent = total.toLocaleString('ja-JP'); }
  function renderMute(){
    soundBtn.textContent = muted ? '🔇' : '🔊';
    soundBtn.classList.toggle('off', muted);
  }
  renderCount(); renderMute();

  soundBtn.addEventListener('click', function(){
    muted = !muted;
    try { localStorage.setItem(STORAGE_MUTE, muted ? '1' : '0'); } catch(e){}
    renderMute();
    if(!muted) ensureAudio();
  });

  // ---- Audio ----
  var ctx = null, master = null;
  function ensureAudio(){
    if(ctx) { if(ctx.state === 'suspended') ctx.resume(); return; }
    try{
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.8;
      master.connect(ctx.destination);
    }catch(e){ ctx = null; }
  }

  function makeNoiseBuffer(durSec, shape){
    var size = Math.max(1, Math.floor(ctx.sampleRate * durSec));
    var buf = ctx.createBuffer(1, size, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<size;i++){
      var x = i / size;
      var env = shape ? shape(x) : (1 - x);
      data[i] = (Math.random()*2 - 1) * env;
    }
    return buf;
  }

  // ---- Sound presets: each takes (t, vel) and builds its own node graph into `master` ----

  function popReal(t, vel){
    // crack: ultra-short broadband transient -- the initial "snap" of the plastic
    var click = ctx.createBufferSource();
    click.buffer = makeNoiseBuffer(0.006, function(x){ return Math.pow(1-x, 6); });
    var clickHP = ctx.createBiquadFilter();
    clickHP.type = 'highpass'; clickHP.frequency.value = 2000;
    var clickGain = ctx.createGain();
    clickGain.gain.value = 0.7 * vel;
    click.connect(clickHP); clickHP.connect(clickGain); clickGain.connect(master);
    click.start(t);

    // body: short bandpassed noise burst -- the main plasticky "pop" resonance,
    // randomized center frequency each time so repeated pops don't sound identical
    var dur = 0.03 + Math.random()*0.025;
    var body = ctx.createBufferSource();
    body.buffer = makeNoiseBuffer(dur, function(x){ return Math.pow(1-x, 2.4); });
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 900 + Math.random()*2000;
    bp.Q.value = 1.6 + Math.random()*1.8;
    var bodyHP = ctx.createBiquadFilter();
    bodyHP.type = 'highpass'; bodyHP.frequency.value = 350;
    var bodyGain = ctx.createGain();
    bodyGain.gain.value = 0.85 * vel;
    body.connect(bp); bp.connect(bodyHP); bodyHP.connect(bodyGain); bodyGain.connect(master);
    body.start(t);

    // thump: brief low-frequency thud giving the pop some physical weight
    var thump = ctx.createOscillator();
    thump.type = 'sine';
    var thumpFreq = 85 + Math.random()*50;
    thump.frequency.setValueAtTime(thumpFreq, t);
    thump.frequency.exponentialRampToValueAtTime(thumpFreq*0.55, t+0.045);
    var thumpGain = ctx.createGain();
    thumpGain.gain.setValueAtTime(0.001, t);
    thumpGain.gain.exponentialRampToValueAtTime(0.32*vel, t+0.003);
    thumpGain.gain.exponentialRampToValueAtTime(0.0001, t+0.055);
    thump.connect(thumpGain); thumpGain.connect(master);
    thump.start(t); thump.stop(t+0.06);
  }

  function popSoft(t, vel){
    // muffled, gentle, like popping wrapped in a blanket
    var dur = 0.07 + Math.random()*0.03;
    var body = ctx.createBufferSource();
    body.buffer = makeNoiseBuffer(dur, function(x){ return Math.pow(1-x, 1.6); });
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 380 + Math.random()*220; bp.Q.value = 0.9;
    var g = ctx.createGain(); g.gain.value = 0.7 * vel;
    body.connect(lp); lp.connect(bp); bp.connect(g); g.connect(master);
    body.start(t);

    var thump = ctx.createOscillator(); thump.type = 'sine';
    var tf = 65 + Math.random()*30;
    thump.frequency.setValueAtTime(tf, t);
    thump.frequency.exponentialRampToValueAtTime(tf*0.6, t+0.09);
    var thumpGain = ctx.createGain();
    thumpGain.gain.setValueAtTime(0.001, t);
    thumpGain.gain.exponentialRampToValueAtTime(0.4*vel, t+0.008);
    thumpGain.gain.exponentialRampToValueAtTime(0.0001, t+0.11);
    thump.connect(thumpGain); thumpGain.connect(master);
    thump.start(t); thump.stop(t+0.12);
  }

  function popCrisp(t, vel){
    // sharp, high, very short -- パリッと
    var click = ctx.createBufferSource();
    click.buffer = makeNoiseBuffer(0.014, function(x){ return Math.pow(1-x, 4); });
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2800;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200 + Math.random()*1800; bp.Q.value = 2.2;
    var g = ctx.createGain(); g.gain.value = 0.9 * vel;
    click.connect(hp); hp.connect(bp); bp.connect(g); g.connect(master);
    click.start(t);
  }

  function popRetro(t, vel){
    // 8bit chiptune blip
    var o = ctx.createOscillator(); o.type = 'square';
    var base = 700 + Math.random()*300;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base*0.35, t+0.05);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.28*vel, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.07);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.08);
  }

  function popDeep(t, vel){
    // weighty, low, satisfying -- ずっしり
    var dur = 0.09 + Math.random()*0.03;
    var body = ctx.createBufferSource();
    body.buffer = makeNoiseBuffer(dur, function(x){ return Math.pow(1-x, 1.8); });
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
    var g = ctx.createGain(); g.gain.value = 0.55 * vel;
    body.connect(lp); lp.connect(g); g.connect(master);
    body.start(t);

    var thump = ctx.createOscillator(); thump.type = 'sine';
    var tf = 55 + Math.random()*25;
    thump.frequency.setValueAtTime(tf, t);
    thump.frequency.exponentialRampToValueAtTime(tf*0.5, t+0.13);
    var thumpGain = ctx.createGain();
    thumpGain.gain.setValueAtTime(0.001, t);
    thumpGain.gain.exponentialRampToValueAtTime(0.5*vel, t+0.01);
    thumpGain.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
    thump.connect(thumpGain); thumpGain.connect(master);
    thump.start(t); thump.stop(t+0.17);
  }

  var SOUND_PRESETS = [
    { id:'real',  emoji:'🫧', name:'リアル',   fn:popReal },
    { id:'soft',  emoji:'☁️', name:'ソフト',   fn:popSoft },
    { id:'crisp', emoji:'✨', name:'パリッと', fn:popCrisp },
    { id:'retro', emoji:'🕹️', name:'レトロ',   fn:popRetro },
    { id:'deep',  emoji:'🌊', name:'ずっしり', fn:popDeep }
  ];

  var soundIndex = 0;
  try {
    var savedSoundId = localStorage.getItem(STORAGE_SOUND);
    var savedIdx = -1;
    for(var si=0; si<SOUND_PRESETS.length; si++){ if(SOUND_PRESETS[si].id === savedSoundId) savedIdx = si; }
    if(savedIdx >= 0) soundIndex = savedIdx;
  } catch(e){}

  function renderSoundPanel(){
    soundPanel.innerHTML = '';
    SOUND_PRESETS.forEach(function(p, i){
      var b = document.createElement('button');
      b.className = 'sound-opt' + (i === soundIndex ? ' active' : '');
      b.innerHTML = '<span class="sw">'+p.emoji+'</span><span>'+p.name+'</span>';
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        soundIndex = i;
        try { localStorage.setItem(STORAGE_SOUND, p.id); } catch(e){}
        renderSoundPanel();
        soundPanel.classList.remove('open');
        ensureAudio();
        if(!muted && ctx) SOUND_PRESETS[i].fn(ctx.currentTime, 1);
      });
      soundPanel.appendChild(b);
    });
  }
  renderSoundPanel();

  voiceBtn.addEventListener('click', function(ev){
    ev.stopPropagation();
    soundPanel.classList.toggle('open');
  });
  document.addEventListener('click', function(ev){
    if(!soundPanel.contains(ev.target) && ev.target !== voiceBtn){
      soundPanel.classList.remove('open');
    }
  });

  function playPop(){
    if(muted) return;
    ensureAudio();
    if(!ctx) return;
    var t = ctx.currentTime;
    var vel = 0.85 + Math.random()*0.3;
    SOUND_PRESETS[soundIndex].fn(t, vel);
  }

  // ---- Grid: an absolute-positioned, virtualized 2D plane -----------------
  // Infinite downward AND rightward. Bubbles are placed by explicit (row,col)
  // pixel coordinates rather than CSS grid auto-flow, so the rendered layout
  // can never drift out of sync with the bookkeeping used to trim old cells.
  var CELL = 44;
  var BUBBLE_SIZE = Math.round(CELL * 0.78);
  var BUBBLE_MARGIN = (CELL - BUBBLE_SIZE) / 2;
  var ROWS_PER_CHUNK = 6, COLS_PER_CHUNK = 4;
  var MAX_ROWS_CAP = 24, MAX_COLS_CAP = 24;

  var minRow = 0, maxRow = -1, minCol = 0, maxCol = -1;
  var cellMap = Object.create(null);

  function cellKey(r, c){ return r + '_' + c; }

  function addCell(r, c){
    var b = document.createElement('div');
    b.className = 'bubble';
    b.dataset.popped = '0';
    b.dataset.row = r;
    b.dataset.col = c;
    var tilt = (Math.random()*10 - 5).toFixed(1);
    b.dataset.tilt = tilt;
    b.style.setProperty('--tilt', tilt + 'deg');
    b.style.setProperty('--hx', (22 + Math.random()*24).toFixed(0) + '%');
    b.style.setProperty('--hy', (16 + Math.random()*24).toFixed(0) + '%');
    b.style.width = BUBBLE_SIZE + 'px';
    b.style.height = BUBBLE_SIZE + 'px';
    b.style.left = ((c - minCol) * CELL + BUBBLE_MARGIN) + 'px';
    b.style.top = ((r - minRow) * CELL + BUBBLE_MARGIN) + 'px';
    cellMap[cellKey(r, c)] = b;
    canvas.appendChild(b);
  }

  function removeCell(r, c){
    var k = cellKey(r, c);
    var b = cellMap[k];
    if(!b) return;
    if(b._squishAnim) b._squishAnim.cancel();
    if(b._timer) clearTimeout(b._timer);
    b.remove();
    delete cellMap[k];
  }

  function updateCanvasBox(){
    canvas.style.width = ((maxCol - minCol + 1) * CELL) + 'px';
    canvas.style.height = ((maxRow - minRow + 1) * CELL) + 'px';
  }

  function growDown(n){
    for(var r = maxRow+1; r <= maxRow+n; r++){
      for(var c = minCol; c <= maxCol; c++) addCell(r, c);
    }
    maxRow += n;
    updateCanvasBox();
  }

  function growRight(n){
    for(var c = maxCol+1; c <= maxCol+n; c++){
      for(var r = minRow; r <= maxRow; r++) addCell(r, c);
    }
    maxCol += n;
    updateCanvasBox();
  }

  function trimTopRows(n){
    n = Math.min(n, maxRow - minRow); // always keep at least one row
    if(n <= 0) return;
    for(var i=0;i<n;i++){
      for(var c = minCol; c <= maxCol; c++) removeCell(minRow, c);
      minRow++;
    }
    for(var k in cellMap){
      cellMap[k].style.top = ((+cellMap[k].dataset.row - minRow) * CELL + BUBBLE_MARGIN) + 'px';
    }
    updateCanvasBox();
    sheet.scrollTop -= n * CELL;
  }

  function trimLeftCols(n){
    n = Math.min(n, maxCol - minCol);
    if(n <= 0) return;
    for(var i=0;i<n;i++){
      for(var r = minRow; r <= maxRow; r++) removeCell(r, minCol);
      minCol++;
    }
    for(var k in cellMap){
      cellMap[k].style.left = ((+cellMap[k].dataset.col - minCol) * CELL + BUBBLE_MARGIN) + 'px';
    }
    updateCanvasBox();
    sheet.scrollLeft -= n * CELL;
  }

  function buildGrid(){
    canvas.innerHTML = '';
    cellMap = Object.create(null);
    var visibleCols = Math.max(1, Math.floor(sheet.clientWidth / CELL));
    var visibleRows = Math.max(1, Math.ceil(sheet.clientHeight / CELL)) + 1;
    var initRows = visibleRows + ROWS_PER_CHUNK * 2;
    var initCols = visibleCols + COLS_PER_CHUNK * 2;
    MAX_ROWS_CAP = initRows + ROWS_PER_CHUNK * 3;
    MAX_COLS_CAP = initCols + COLS_PER_CHUNK * 3;
    minRow = 0; maxRow = initRows - 1;
    minCol = 0; maxCol = initCols - 1;
    for(var r = minRow; r <= maxRow; r++){
      for(var c = minCol; c <= maxCol; c++) addCell(r, c);
    }
    updateCanvasBox();
    sheet.scrollTop = 0;
    sheet.scrollLeft = 0;
  }

  var scrollTicking = false;
  sheet.addEventListener('scroll', function(){
    if(!scrollCue.classList.contains('hidden')) scrollCue.classList.add('hidden');
    if(scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(function(){
      scrollTicking = false;
      var threshY = CELL * ROWS_PER_CHUNK * 1.5;
      if(sheet.scrollTop + sheet.clientHeight > sheet.scrollHeight - threshY){
        growDown(ROWS_PER_CHUNK);
        if(maxRow - minRow + 1 > MAX_ROWS_CAP) trimTopRows(ROWS_PER_CHUNK);
      }
      var threshX = CELL * COLS_PER_CHUNK * 1.5;
      if(sheet.scrollLeft + sheet.clientWidth > sheet.scrollWidth - threshX){
        growRight(COLS_PER_CHUNK);
        if(maxCol - minCol + 1 > MAX_COLS_CAP) trimLeftCols(COLS_PER_CHUNK);
      }
    });
  });

  function spawnParticles(el){
    var rect = el.getBoundingClientRect();
    var mr = mainEl.getBoundingClientRect();
    var cx = rect.left + rect.width/2 - mr.left;
    var cy = rect.top + rect.height/2 - mr.top;
    var count = 6 + Math.floor(Math.random()*5);
    for(var i=0;i<count;i++){
      var p = document.createElement('div');
      p.className = 'particle';
      var size = 3 + Math.random()*4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      mainEl.appendChild(p);

      var angle = Math.random() * Math.PI * 2;
      var dist = 16 + Math.random() * 26;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist;
      var rot = (Math.random()*360).toFixed(0);

      var anim = p.animate([
        { transform:'translate(-50%,-50%) rotate(0deg) scale(1)', opacity:1 },
        { transform:'translate(calc(-50% + '+(dx*0.6)+'px), calc(-50% + '+(dy*0.6)+'px)) rotate('+rot+'deg) scale(.85)', opacity:.95, offset:.4 },
        { transform:'translate(calc(-50% + '+dx+'px), calc(-50% + '+(dy+16)+'px)) rotate('+(rot*1.6)+'deg) scale(.15)', opacity:0 }
      ], { duration: 460 + Math.random()*180, easing:'cubic-bezier(.2,.7,.35,1)' });
      anim.onfinish = function(node){ return function(){ node.remove(); }; }(p);
    }
  }

  function spawnFlash(el){
    var rect = el.getBoundingClientRect();
    var mr = mainEl.getBoundingClientRect();
    var cx = rect.left + rect.width/2 - mr.left;
    var cy = rect.top + rect.height/2 - mr.top;
    var f = document.createElement('div');
    f.className = 'pop-flash';
    var sz = rect.width * 2.4;
    f.style.width = sz + 'px';
    f.style.height = sz + 'px';
    f.style.left = cx + 'px';
    f.style.top = cy + 'px';
    mainEl.appendChild(f);
    var anim = f.animate([
      { transform:'translate(-50%,-50%) scale(.25)', opacity:.6 },
      { transform:'translate(-50%,-50%) scale(1)', opacity:0 }
    ], { duration: 300, easing:'ease-out' });
    anim.onfinish = function(){ f.remove(); };
  }

  function pop(el){
    if(!el || el.dataset.popped === '1') return;
    el.dataset.popped = '1';
    el.classList.remove('pop-anim');
    void el.offsetWidth;
    el.classList.add('pop-anim');
    playPop();
    if(navigator.vibrate) { try{ navigator.vibrate([10,8,14]); }catch(e){} }

    var tilt = el.dataset.tilt;
    if(el._squishAnim) el._squishAnim.cancel();
    el._squishAnim = el.animate([
      { transform:'rotate('+tilt+'deg) scale(1,1)' },
      { transform:'rotate('+tilt+'deg) scale(1.22,0.6)', offset:.1 },
      { transform:'rotate('+tilt+'deg) scale(0.5,1.32)', offset:.26 },
      { transform:'rotate('+tilt+'deg) scale(0.92,0.64)', offset:.44 },
      { transform:'rotate('+tilt+'deg) scale(0.66,0.86)', offset:.64 },
      { transform:'rotate('+tilt+'deg) scale(0.78,0.7)', offset:.82 },
      { transform:'rotate('+tilt+'deg) scale(0.74,0.74)' }
    ], { duration: 460, easing:'cubic-bezier(.22,.85,.32,1)', fill:'forwards' });

    spawnFlash(el);
    spawnParticles(el);

    if(mainEl._punchAnim) mainEl._punchAnim.cancel();
    mainEl._punchAnim = mainEl.animate([
      { transform:'scale(1)' },
      { transform:'scale(1.003)' },
      { transform:'scale(1)' }
    ], { duration: 110, easing:'ease-out' });

    total++;
    renderCount();
    try { localStorage.setItem(STORAGE_COUNT, String(total)); } catch(e){}

    if(!hint.classList.contains('hidden')) hint.classList.add('hidden');

    var delay = 700 + Math.random()*1900;
    el._timer = setTimeout(function(){
      el.dataset.popped = '0';
      if(el._squishAnim) el._squishAnim.cancel();
      el._squishAnim = el.animate([
        { transform:'rotate('+tilt+'deg) scale(0.74,0.74)' },
        { transform:'rotate('+tilt+'deg) scale(1.18,0.82)', offset:.45 },
        { transform:'rotate('+tilt+'deg) scale(0.9,1.08)', offset:.72 },
        { transform:'rotate('+tilt+'deg) scale(1,1)' }
      ], { duration: 420, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'forwards' });
    }, delay);
  }

  var dragging = false;

  function handlePointer(e){
    var el = e.target;
    if(el && el.classList && el.classList.contains('bubble')) pop(el);
  }

  sheet.addEventListener('pointerdown', function(e){
    dragging = true;
    ensureAudio();
    handlePointer(e);
  });
  sheet.addEventListener('pointermove', function(e){
    if(dragging) handlePointer(e);
  });
  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('pointercancel', function(){ dragging = false; });
  window.addEventListener('blur', function(){ dragging = false; });

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildGrid, 200);
  });

  buildGrid();
})();
</script>
</body>
</html>
